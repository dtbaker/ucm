name: CI

on:
  push:
    branches: [master, '2026-revive-*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # composer.json asks for ^8.4 and index.php refuses to start on anything older, so
    # 8.4 is what has to pass. 8.5 is checked too, because the next PHP is always the
    # one that breaks a codebase this old, and it is better to hear about it early than
    # from a customer. It does not block the build yet - see the note on the matrix.
    name: php -l (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.php == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every source file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -name '*.php' \
                     -not -path './vendor/*' \
                     -not -path './node_modules/*' \
                     -not -path './temp/*' -print0)
          exit $fail

  phpcs:
    name: Coding standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
      - name: phpcs
        run: ./vendor/bin/phpcs -q --report=checkstyle -d memory_limit=2G | cs2pr

  phpstan:
    name: PHPStan (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.php == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  phpunit:
    name: PHPUnit (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.php == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
      - run: ./vendor/bin/phpunit

  install:
    name: Install from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Work out which browser build we need
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Reuse the browser download from a previous run
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install the browser's system packages
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Make the files writable by the web server
        # The installer checks the same things a real host would: that it can write to
        # the base folder, includes/ and temp/. A git checkout is owned by the runner,
        # not by the web server user inside the container.
        run: chmod -R a+rwX . && chmod a+w cron.php ext.php design_menu.php includes/config.php
      - name: Start the database
        run: docker compose up -d db
      - name: Start a copy of the app against an empty database
        run: ./scripts/install-test.sh
      - name: Confirm the setup wizard is waiting for us
        # The install tests skip themselves when there is nothing to install, so make
        # sure there really is, otherwise a broken installer would look like a pass.
        run: curl -fsSL http://localhost:8092/ | grep -q 'Database Connection Details'
      - name: Walk the setup wizard
        run: npx playwright test tests/e2e/install.spec.ts
      - name: Check every guarded form still saves
        # The form security token breaks a form silently - the page still renders, the
        # save just stops working - so these run against a brand new install, which is
        # where a form that forgot to publish the token would show up differently.
        env:
          UCM_BASE_URL: http://localhost:8092
        run: npx playwright test tests/e2e/csrf.spec.ts tests/e2e/csrf-modules.spec.ts tests/e2e/auth.spec.ts tests/e2e/address.spec.ts
      - name: Check the public pages for PHP warnings
        env:
          UCM_BASE_URL: http://localhost:8092
        run: npx playwright test tests/e2e/public.spec.ts
      - name: Check every plugin page for PHP warnings
        env:
          UCM_BASE_URL: http://localhost:8092
        run: npx playwright test tests/e2e/smoke.spec.ts
      - name: Collect the app log
        if: always()
        run: docker compose --profile install-test logs app-install-test > app.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: install-report
          path: |
            playwright-report/
            app.log
          retention-days: 7
