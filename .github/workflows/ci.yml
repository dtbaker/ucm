name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # composer.json asks for ^8.2 and index.php refuses to start on anything older, so
    # 8.2 is the floor and has to pass - it is what most shared hosting still runs. 8.3
    # and 8.4 are the versions in between, and 8.5 is checked too, because the next PHP
    # is always the one that breaks a codebase this old. Saying "PHP 8.2 or newer" is only
    # honest if something proves it. All four pass today, so all four block.
    #
    # If a future 8.5 release starts failing for reasons that are not ours, add
    #   continue-on-error: ${{ matrix.php == '8.5' }}
    # to the job rather than dropping it from the matrix.
    name: php -l (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every source file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -name '*.php' \
                     -not -path './vendor/*' \
                     -not -path './node_modules/*' \
                     -not -path './temp/*' -print0)
          exit $fail

  phpcs:
    # Also runs PHPCompatibility, which is what mechanically proves the "PHP 8.2 or
    # newer" claim - it finds functions and syntax that stopped working in a version
    # we say we support.
    name: Coding standard + PHP compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
      - name: phpcs
        run: ./vendor/bin/phpcs -q --report=checkstyle -d memory_limit=2G | cs2pr

  phpstan:
    # One version. It analyses the same code whichever PHP runs it, and the baseline
    # would catch a version that saw it differently: an entry one version needs and
    # another does not fails the other as an unmatched ignored error. Run on 8.2-8.5 it
    # agreed on every run it had. 8.4 is what the baseline is generated with locally.
    # Whether the code runs on each version is the lint and phpcs jobs' question.
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  phpunit:
    # The oldest and newest PHP we support. Nothing in tests/unit branches on the PHP
    # version, so 8.3 and 8.4 sit between two runs that already pass and add nothing.
    name: PHPUnit (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
      - run: ./vendor/bin/phpunit

  dependencies:
    # Two separate questions. What we ship has to be clean, so that part blocks. Build
    # tooling that never leaves this repository is worth knowing about but is not worth
    # stopping a release for, so that part only reports.
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
      - name: Advisories against anything that ships
        run: composer audit --locked --no-dev
      - name: Advisories against the build tooling
        continue-on-error: true
        run: composer audit --locked

  semgrep:
    # Advisory on purpose. There is a decade of findings waiting in here and a security
    # job that is red on every single pull request is a security job nobody reads. The
    # results go to the Security tab, where they can be worked through and then promoted
    # to blocking one rule at a time.
    #
    # Do not gate anything on the NUMBER of findings here. Five local runs of this exact
    # command against one unchanged tree returned 937, 905, 912, 901 and 906, and this
    # job's own history shows 959-1050 across near-identical commits. The variance is all
    # in one rule, echoed-request, on a handful of large PHP files: scan
    # includes/plugin_invoice/pages/invoice_admin_credit.php on its own and it reports 86
    # every time, scan it as part of the tree and it reports between 26 and 46. --timeout 0
    # does not change that, so it is the taint engine under parallelism rather than a rule
    # timing out. tainted-sql-string and tainted-filename were identical in every run.
    # Named rules are stable, which is what the blocking job below relies on.
    #
    # One rule is excluded rather than triaged. request-host-used is an nginx rule written
    # in generic mode, so it matches the five characters "$host" in any file at all. Its
    # eight hits are a PHP local variable in module_config::upgrade_url_is_allowed(), which
    # holds a parse_url() component and exists to refuse hosts that are not on the allow
    # list. There is no edit to that function that would satisfy the rule short of renaming
    # the variable, so it is turned off here instead of being renamed to please a linter.
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan
        run: |
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --exclude vendor --exclude node_modules --exclude temp \
            --exclude 'includes/plugin_pdf/dompdf' \
            --exclude 'includes/plugin_security/htmlpurifier' \
            --exclude 'includes/plugin_encrypt/phpseclib' \
            --exclude 'includes/plugin_paymethod_stripe/stripe-php' \
            --exclude 'includes/plugin_ticket/cron/mime_parser.php' \
            --exclude 'js/tiny_mce3.4.4' \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used \
            --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  semgrep-blocking:
    # The other half of "advisory on purpose": rules that have been worked through until
    # nothing in the tree matches them. Those block, so the clearing does not quietly
    # come undone. A rule moves here only once it is at zero and every exception carries
    # a nosemgrep comment saying why.
    #
    # Cleared so far:
    #   tainted-callable            3 findings. One was real (the import page now insists
    #                               the callback names a module import handler); the other
    #                               two are suppressed in place with a reason.
    #   unknown-value-with-script-tag,
    #   react-unsanitized-method    only ever matched the bundled TinyMCE, which is
    #                               excluded with dompdf, htmlpurifier and phpseclib.
    #   curl-ssl-verifypeer-off     one, in the bundled Authorize.Net library (since removed): its pinned
    #                               CA bundle expired in 2012 and the documented
    #                               workaround was to stop verifying the peer on a request
    #                               carrying a card number. It verifies against the host's
    #                               own store now.
    #   plaintext-http-link         one link left in the credits, now https. The credits
    #                               page now lives in the online documentation, whose
    #                               source is the ucm-web repository.
    name: Semgrep (blocking rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rules that are clear, and have to stay clear
        run: |
          semgrep scan --error \
            --config r/php.lang.security.injection.tainted-callable \
            --config r/javascript.lang.security.audit.unknown-value-with-script-tag \
            --config r/typescript.react.security.audit.react-unsanitized-method \
            --config r/php.lang.security.curl-ssl-verifypeer-off \
            --config r/html.security.plaintext-http-link \
            --exclude vendor --exclude node_modules --exclude temp \
            --exclude 'includes/plugin_pdf/dompdf' \
            --exclude 'includes/plugin_security/htmlpurifier' \
            --exclude 'includes/plugin_encrypt/phpseclib' \
            --exclude 'includes/plugin_paymethod_stripe/stripe-php' \
            --exclude 'includes/plugin_ticket/cron/mime_parser.php' \
            --exclude 'js/tiny_mce3.4.4'

  # The documentation lives in its own repository, github.com/dtbaker/ucm-web, and so does
  # the check that the help index and screen maps shipped here are in step with its
  # articles (the article text itself is read from the website, not shipped). What is
  # checked here is how this repository talks to it: tests/unit/HelpDocsTest.php pins the
  # outbound URL and header set, and runs in the phpunit job above.

  package:
    # The item archive is not the repository. CodeCanyon wants three folders at the top -
    # Main Files, Documentation, Licensing - and it wants nothing in there that only
    # exists to build or test the product. Building it on every change means the shape is
    # checked continuously rather than discovered the week of a submission.
    name: Build and check the item archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, phpcs, phpstan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The build runs `composer install` to put vendor/ in the archive, and the lock file
      # is resolved on PHP 8.4, the version the release is built with. Without this the
      # runner's own PHP decides, and it can be a different one.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Build it and check its shape
        run: ./scripts/build-release.sh --verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecanyon-zip
          path: build/ucm-codecanyon.zip
          retention-days: 7

  install:
    name: Install from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Work out which browser build we need
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Reuse the browser download from a previous run
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install the browser's system packages
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Make the files writable by the web server
        # The installer checks the same things a real host would: that it can write to
        # the base folder, includes/ and temp/. A git checkout is owned by the runner,
        # not by the web server user inside the container.
        run: chmod -R a+rwX . && chmod a+w cron.php ext.php design_menu.php includes/config.php
      - name: Start the database
        run: docker compose up -d db
      - name: Start a copy of the app against an empty database
        run: ./scripts/install-test.sh
      - name: Confirm the setup wizard is waiting for us
        # The install tests skip themselves when there is nothing to install, so make
        # sure there really is, otherwise a broken installer would look like a pass.
        run: curl -fsSL http://localhost:8092/ | grep -q 'Database Connection Details'
      - name: Walk the setup wizard
        run: npx playwright test tests/e2e/install.spec.ts
      - name: Check every guarded form still saves
        # The form security token breaks a form silently - the page still renders, the
        # save just stops working - so these run against a brand new install, which is
        # where a form that forgot to publish the token would show up differently.
        env:
          UCM_BASE_URL: http://localhost:8092
        run: npx playwright test tests/e2e/csrf.spec.ts tests/e2e/csrf-modules.spec.ts tests/e2e/auth.spec.ts tests/e2e/address.spec.ts
      - name: Check the public pages for PHP warnings
        env:
          UCM_BASE_URL: http://localhost:8092
        run: npx playwright test tests/e2e/public.spec.ts
      - name: Check every plugin page for PHP warnings
        env:
          UCM_BASE_URL: http://localhost:8092
        run: npx playwright test tests/e2e/smoke.spec.ts
      - name: Collect the app log
        if: always()
        run: docker compose --profile install-test logs app-install-test > app.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-report
          path: |
            playwright-report/
            app.log
          retention-days: 7
