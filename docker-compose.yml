services:
  app:
    build: .
    container_name: ucm-app
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./temp:/var/www/html/temp
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - UCM_DEBUG=1
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: ucm-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ucm
      MYSQL_USER: ucm
      MYSQL_PASSWORD: ucm
    ports:
      - "8096:3306"
    volumes:
      - ucm_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ucm-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ucm-phpmyadmin
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_USER: ucm
      PMA_PASSWORD: ucm
    depends_on:
      - db
    restart: unless-stopped

volumes:
  ucm_mysql_data:
