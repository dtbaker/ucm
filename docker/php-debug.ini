; Enable error display for Docker development - errors appear in docker-compose logs
display_errors = 1
; Startup errors stay out of the page body. PHP emits them before any script runs, so
; printing one sends the response headers early: session_start() then fails, the request
; arrives logged out, and the browser gets the login page instead of whatever actually
; went wrong. A post that exceeds max_input_vars does exactly that. log_errors below still
; records them, which is what this file is for.
display_startup_errors = 0
error_reporting = E_ALL
log_errors = 1
; Send errors to stderr so they appear in docker-compose logs app
error_log = /proc/self/fd/2
